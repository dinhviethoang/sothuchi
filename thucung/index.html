<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Thú Cưng</title>
<meta name="description" content="Sổ thu chi cá nhân của Hoàng.">
<meta name="theme-color" content="#FFF6F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Thú Cưng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#FFF6F4;--fg:#43293A;--muted:#8C7183;--ink:#FF6F8E}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
  iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
  .splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:2;transition:opacity .35s}
  .splash.hide{opacity:0;pointer-events:none}
  .splash .box{display:grid;justify-items:center;gap:14px;text-align:center;padding:24px}
  .splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 0 0 1px rgba(34,211,238,.35),0 0 40px rgba(34,211,238,.25)}
  .splash h1{margin:0;font-size:20px;letter-spacing:.04em}
  .splash p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}
  .bar{width:140px;height:3px;border-radius:3px;background:rgba(34,211,238,.15);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:var(--ink);border-radius:3px;animation:run 1.1s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .btn{border:0;background:var(--ink);color:#04131a;font-weight:700;font-size:15px;padding:12px 22px;border-radius:12px}
  .install{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:10px;
    background:rgba(13,20,34,.96);border:1px solid rgba(34,211,238,.45);box-shadow:0 0 24px rgba(34,211,238,.25);border-radius:14px;padding:10px 10px 10px 12px;color:var(--fg);font-size:14px;line-height:1.35;max-width:560px;margin:0 auto}
  .install img{width:36px;height:36px;border-radius:10px;flex:none}
  .install .t{flex:1;min-width:0}
  .install b{display:block;font-size:14.5px}
  .install small{color:var(--muted);font-size:12.5px}
  .install .go{border:0;background:var(--ink);color:#04131a;font-weight:700;border-radius:10px;padding:9px 14px;font-size:14px;flex:none}
  .install .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px;flex:none}
  .install[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div class="splash" id="splash">
  <div class="box">
    <img src="icon-192.png" alt="">
    <h1>Sổ Thú Cưng</h1>
    <p id="msg">Đang mở sổ của bạn…</p>
    <div class="bar" id="bar"><i></i></div>
    <button class="btn" id="retry" hidden>Thử lại</button>
  </div>
</div>
<div class="install" id="install" hidden role="dialog" aria-label="Cài đặt ứng dụng">
  <img src="icon-192.png" alt="">
  <div class="t"><b id="insTitle">Cài Sổ Thú Cưng vào điện thoại</b><small id="insText">Mở nhanh từ màn hình chính, chạy toàn màn hình.</small></div>
  <button class="go" id="insGo">Cài đặt</button>
  <button class="x" id="insX" aria-label="Đóng">×</button>
</div>
<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwmljSJCfWkA8Xypc9UfyRg1bKw9VIYt1KVK-AXyRjQkSVqaNTQopKdJH97pBApiwjQzA/exec?app=thucung';
  const splash = document.getElementById('splash'), msg = document.getElementById('msg'),
        bar = document.getElementById('bar'), retry = document.getElementById('retry');

  function offline(){
    splash.classList.remove('hide');
    msg.textContent = 'Mất kết nối. Sổ Thú Cưng cần Internet để đọc Google Sheet. Kiểm tra Wi-Fi hoặc 4G rồi thử lại.';
    bar.hidden = true; retry.hidden = false;
  }
  function start(){
    if (!navigator.onLine) { offline(); return; }
    msg.textContent = 'Đang mở sổ của bạn…'; bar.hidden = false; retry.hidden = true;
    const app = document.getElementById('app'); app.innerHTML = '';
    const f = document.createElement('iframe');
    f.src = APP_URL; f.title = 'Sổ Thú Cưng';
    f.allow = 'clipboard-write';
    f.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 250));
    app.appendChild(f);
    setTimeout(() => { if (!splash.classList.contains('hide') && !navigator.onLine) offline(); }, 12000);
  }
  retry.addEventListener('click', start);
  window.addEventListener('offline', offline);
  window.addEventListener('online', () => { if (!retry.hidden) start(); });
  start();


  // ---------- nút cài đặt ----------
  const ins=document.getElementById('install'),insGo=document.getElementById('insGo'),insX=document.getElementById('insX'),
        insTitle=document.getElementById('insTitle'),insText=document.getElementById('insText');
  const ua=navigator.userAgent||'';
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const inApp=/Zalo|FBAN|FBAV|FB_IAB|Instagram|Line\/|Messenger|TikTok/i.test(ua);
  const isIOS=/iPhone|iPad|iPod/i.test(ua);
  const isAndroid=/Android/i.test(ua);
  const isChrome=/Chrome\//.test(ua)&&!/EdgA|OPR|SamsungBrowser|MiuiBrowser|HeyTapBrowser|UCBrowser|CocCoc|coc_coc/i.test(ua);
  let deferred=null,dismissed=false;
  try{dismissed=localStorage.getItem('sothuchi.insDismiss')==='1'}catch(e){}
  function showIns(title,text,btn){if(standalone||dismissed)return;insTitle.textContent=title;insText.textContent=text;insGo.hidden=!btn;if(btn)insGo.textContent=btn;ins.hidden=false}
  insX.onclick=()=>{ins.hidden=true;try{localStorage.setItem('sothuchi.insDismiss','1')}catch(e){}};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showIns('Cài Sổ Thú Cưng vào điện thoại','Mở nhanh từ màn hình chính, chạy toàn màn hình.','Cài đặt')});
  insGo.onclick=async()=>{
    if(deferred){deferred.prompt();const r=await deferred.userChoice.catch(()=>null);deferred=null;ins.hidden=true;return}
    if(inApp){try{await navigator.clipboard.writeText(location.href);insText.textContent='Đã copy link. Mở Chrome, dán vào thanh địa chỉ rồi cài.'}catch(e){insText.textContent='Copy link này rồi mở bằng Chrome: '+location.href}}
  };
  window.addEventListener('appinstalled',()=>{ins.hidden=true});
  if(!standalone){
    if(inApp) showIns('Mở bằng Chrome để cài','Trình duyệt trong Zalo/Messenger không cài được app. Bấm ⋮ hoặc … → "Mở bằng trình duyệt", hoặc copy link.','Copy link');
    else if(isIOS) showIns('Cài vào iPhone','Mở bằng Safari, bấm nút Chia sẻ (ô vuông có mũi tên) → "Thêm vào MH chính".',null);
    else setTimeout(()=>{ if(deferred||!ins.hidden) return;
      if(isAndroid&&isChrome) showIns('Cài Sổ Thú Cưng','Bấm ⋮ ở góc trên bên phải → "Cài đặt ứng dụng" hoặc "Thêm vào màn hình chính".',null);
      else if(isAndroid) showIns('Mở bằng Chrome để cài dễ nhất','Hoặc tìm mục "Thêm vào màn hình chính" / "Thêm trang vào" trong menu của trình duyệt này.',null);
    },3500);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
