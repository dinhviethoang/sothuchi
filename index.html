<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Thu Chi</title>
<meta name="description" content="Sổ thu chi cá nhân của Hoàng.">
<meta name="theme-color" content="#070b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Thu Chi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#070b14;--fg:#e6edf8;--muted:#8b9ab3;--ink:#22d3ee}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
  iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
  .splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:2;transition:opacity .35s}
  .splash.hide{opacity:0;pointer-events:none}
  .splash .box{display:grid;justify-items:center;gap:14px;text-align:center;padding:24px}
  .splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 0 0 1px rgba(34,211,238,.35),0 0 40px rgba(34,211,238,.25)}
  .splash h1{margin:0;font-size:20px;letter-spacing:.04em}
  .splash p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}
  .bar{width:140px;height:3px;border-radius:3px;background:rgba(34,211,238,.15);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:var(--ink);border-radius:3px;animation:run 1.1s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .btn{border:0;background:var(--ink);color:#04131a;font-weight:700;font-size:15px;padding:12px 22px;border-radius:12px}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div class="splash" id="splash">
  <div class="box">
    <img src="icon-192.png" alt="">
    <h1>Sổ Thu Chi</h1>
    <p id="msg">Đang mở sổ của bạn…</p>
    <div class="bar" id="bar"><i></i></div>
    <button class="btn" id="retry" hidden>Thử lại</button>
  </div>
</div>
<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwmljSJCfWkA8Xypc9UfyRg1bKw9VIYt1KVK-AXyRjQkSVqaNTQopKdJH97pBApiwjQzA/exec';
  const splash = document.getElementById('splash'), msg = document.getElementById('msg'),
        bar = document.getElementById('bar'), retry = document.getElementById('retry');

  function offline(){
    splash.classList.remove('hide');
    msg.textContent = 'Mất kết nối. Sổ Thu Chi cần Internet để đọc Google Sheet. Kiểm tra Wi-Fi hoặc 4G rồi thử lại.';
    bar.hidden = true; retry.hidden = false;
  }
  function start(){
    if (!navigator.onLine) { offline(); return; }
    msg.textContent = 'Đang mở sổ của bạn…'; bar.hidden = false; retry.hidden = true;
    const app = document.getElementById('app'); app.innerHTML = '';
    const f = document.createElement('iframe');
    f.src = APP_URL; f.title = 'Sổ Thu Chi';
    f.allow = 'clipboard-write';
    f.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 250));
    app.appendChild(f);
    setTimeout(() => { if (!splash.classList.contains('hide') && !navigator.onLine) offline(); }, 12000);
  }
  retry.addEventListener('click', start);
  window.addEventListener('offline', offline);
  window.addEventListener('online', () => { if (!retry.hidden) start(); });
  start();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
